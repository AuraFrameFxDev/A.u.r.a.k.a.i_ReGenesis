# ???????????????????????????????????????????????????????????????????????????
# JVM Arguments ? Enable Java 25 preview features
# ???????????????????????????????????????????????????????????????????????????
org.gradle.jvmargs=--enable-preview -Xmx6g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# ???????????????????????????????????????????????????????????????????????????
# Kotlin Compiler Settings
# ???????????????????????????????????????????????????????????????????????????
# Validate that jvmTarget matches the toolchain version (warn if mismatch)
kotlin.jvm.target.validation.mode=warning
kotlin.daemon.jvmargs=-Xmx2g

# Use fast incremental compilation
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.incremental.native=true

# ???????????????????????????????????????????????????????????????????????????
# Gradle Settings (Performance & Stability)
# ???????????????????????????????????????????????????????????????????????????
# Parallel build execution
org.gradle.parallel=true

# Enable build cache
org.gradle.caching=true

# Watch the file system
org.gradle.vfs.watch=true

# Property to skip tests if needed (referenced in build.gradle.kts)
aurafx.skip.tests=false

# ???????????????????????????????????????????????????????????????????????????
# Android Gradle Plugin Settings
# ???????????????????????????????????????????????????????????????????????????
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Enable desugaring for Java 25 compatibility on older Android versions
android.enableCoreLibraryDesugaring=true

# ???????????????????????????????????????????????????????????????????????????
# Daemon Settings (Gradle build speed optimization)
# ???????????????????????????????????????????????????????????????????????????
org.gradle.daemon=true
org.gradle.daemon.idletimeout=60000
org.gradle.configuration-cache=true

# ???????????????????????????????????????????????????????????????????????????
# Moshi KSP Configuration (suppress KAPT deprecation warnings)
# ???????????????????????????????????????????????????????????????????????????
moshi.generated.enum.companion=false

# ???????????????????????????????????????????????????????????????????????????
# Firebase & Google Services (optional, for your project)
# ???????????????????????????????????????????????????????????????????????????
# (Add Firebase config if needed)
