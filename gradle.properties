# ???????????????????????????????????????????????????????????????????????????
# JVM args, Kotlin settings, and Gradle daemon config
#
# WARNING (Issue #50): Beware of bidirectional Unicode characters in source files.
# ReGenesis enforces clean UTF-8 encoding for all .kts and .kt files.
# ???????????????????????????????????????????????????????????????????????????
.gradlew=-Dorg.gradle.configuration-cache.parallel=true
# ???????????????????????????????????????????????????????????????????????????
# JVM Arguments ? Enable Java 25 preview features
# ???????????????????????????????????????????????????????????????????????????
org.gradle.jvmargs=--enable-preview -Xmx4096m -XX:+UseParallelGC
# ???????????????????????????????????????????????????????????????????????????
# Kotlin Compiler Settings
# ???????????????????????????????????????????????????????????????????????????
# Validate that jvmTarget matches the toolchain version (warn if mismatch)
kotlin.jvm.target.validation.mode=warning

# AGP 9.0 / Hilt Compatibility Bridge
# CRITICAL: KSP is not compatible with AGP's built-in Kotlin - must disable
# Performance & Modern Defaults
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2

# Property to skip tests if needed (referenced in build.gradle.kts)
aurafx.skip.tests=false

# ─────────────────────────────────────────────────────────────────────────────
# Kotlin daemon / incremental build stability (Windows)
# Avoid rare FileNotFound/NoSuchFile issues during incremental .class moves.
# ─────────────────────────────────────────────────────────────────────────────
kotlin.daemon.enabled=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.nonTransitiveRClass=true

# NDK
android.ndkVersion=29.0.14206865
org.gradle.configuration-cache=true
FIREBASE_OAUTH_CLIENT_ID=35417750637-4m0mong9mjselgr4milhc4mamu5706nu.apps.googleusercontent.com
