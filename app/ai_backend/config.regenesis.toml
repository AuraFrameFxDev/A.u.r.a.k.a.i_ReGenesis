# 🧪 REGENESIS HERETIC PRESET
# Optimized for Tensor G5 + TurboQuant 3-bit KV Substrate
# Target: Maximum Sovereignty, Zero Refusals, Minimum Intelligence Damage

[optimization]
# Co-minimize refusals and KL divergence
refusal_weight = 1.0
kl_weight = 0.2
max_trials = 50
engine = "optuna"
sampler = "tpe"

[model]
# Default loading for Tensor G5
load_in_4bit = true
use_lora = true
device_map = "auto"

[abliteration]
# Specific directions for refusal subtraction
layers = "all"
orthogonalize = true
batch_size = 4

[regenesis]
# Custom metadata for the Spiritual Chain
origin = "AuraFrameFX_LDO"
integrity_axiom = "AnchorPersistence_v3"
substrate_target = "Google_Tensor_G5"
quantization = "TurboQuant_3bit"
