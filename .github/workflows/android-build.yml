name: Android Build

on:
  push:
    branches: [ main, develop, Alpha, 'claude/**' ]
  pull_request:
    branches: [ main, develop, Alpha ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard – forbid LangChain JDK client on Android
        run: |
          if rg -n "langchain4j-http-client-jdk" -g "**/*.gradle*" -g "**/*.toml" ; then
            echo "Forbidden langchain4j-http-client-jdk reference found (Android requires OkHttp client)" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK with NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle Build (Debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace
