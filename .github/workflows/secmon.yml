name: Security audit
on:
  push: { branches: [ Auraframe ] }
  pull_request: { branches: [ Auraframe ] }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # OWASP Dependency-Check for Gradle/Maven deps
      - name: Add OWASP DC plugin
        run: |
          if ! rg -n "org.owasp.dependencycheck" gradle/libs.versions.toml >/dev/null; then
            echo "pluginManagement { repositories { gradlePluginPortal() } }" | sed '1s/^/plugins { id("org.owasp.dependencycheck") version "10.0.3" apply false }\n/' -i.bak settings.gradle.kts || true
          fi
      - name: Run dependency check
        run: ./gradlew -S :app:dependencyCheckAnalyze
      - uses: actions/upload-artifact@v7
        with:
          name: depcheck-report
          path: app/build/reports/dependency-check-report.html
          if-no-files-found: ignore

      # Python: pip-audit for requirements.txt
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pipx install pip-audit
      - name: Audit Python requirements
        run: pip-audit -r app/ai_backend/requirements.txt -f json -o pip-audit.json || true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: pip-audit.json
